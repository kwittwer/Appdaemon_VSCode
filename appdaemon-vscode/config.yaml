---
name: AppDaemon + VS Code
version: "1.0.0"
slug: appdaemon-vscode
description: >-
  AppDaemon 4.x mit integriertem VS Code (code-server) und debugpy
  fuer Remote-Debugging von AppDaemon-Apps.
url: https://github.com/kwittwer/Appdaemon_VSCode/tree/main/addon-repo/appdaemon-vscode
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
webui: http://[HOST]:[PORT:5050]
ingress: true
ingress_port: 8000
panel_icon: mdi:microsoft-visual-studio-code
panel_title: AppDaemon Code
ports:
  5050/tcp: 5050
  5678/tcp: 5678
ports_description:
  5050/tcp: AppDaemon Web UI / Dashboard
  5678/tcp: debugpy Remote Debugging (VS Code attach)
map:
  - addon_config:rw
  - homeassistant_config:rw
  - share:rw
  - ssl
options:
  log_level: info
  system_packages: []
  python_packages: []
  init_commands: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  system_packages:
    - str
  python_packages:
    - str
  init_commands:
    - str
