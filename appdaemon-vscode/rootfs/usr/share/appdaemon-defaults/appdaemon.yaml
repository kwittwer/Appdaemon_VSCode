---
# AppDaemon main configuration
# Docs: https://appdaemon.readthedocs.io/
#
# The Home Assistant plugin uses the internal Supervisor proxy, so no
# Long-Lived Access Token is required. Authentication happens automatically
# via the add-on's Supervisor token.
appdaemon:
  latitude: 0.0
  longitude: 0.0
  elevation: 0
  time_zone: Europe/Berlin
  plugins:
    HASS:
      type: hass
      ha_url: http://supervisor/core
      token: !env_var SUPERVISOR_TOKEN

logs:
  main_log:
    filename: /logs/appdaemon.log
  error_log:
    filename: /logs/appdaemon.log
  access_log:
    filename: /logs/access.log
  diag_log:
    filename: /logs/diag.log

http:
  url: http://0.0.0.0:5050

admin:
api:
hadashboard:
